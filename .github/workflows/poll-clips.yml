name: Poll for new Twitch clips

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping clip checker endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -sf -H "Authorization: Bearer $CRON_SECRET" https://cupcakemafiatv-github-io.vercel.app/api/post-new-clip
