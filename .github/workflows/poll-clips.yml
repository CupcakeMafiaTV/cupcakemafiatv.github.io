name: Poll for new Twitch clips

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping clip checker endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Configure the CRON_SECRET repository secret to match Vercel before enabling this job."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://cupcakemafiatv-github-io.vercel.app/api/post-new-clip
