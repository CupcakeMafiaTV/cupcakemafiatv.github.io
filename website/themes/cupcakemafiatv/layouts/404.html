{{ define "main" }}

<main id="main-content" style="flex-grow: 1; display: flex; align-items: center; padding: 60px 20px;">
    <div style="max-width: 620px; margin: 0 auto; text-align: center;">

        <img src="/img/emotes/Confusion.png" alt="" width="300" height="300" style="width: 150px; height: auto; margin: 0 auto 24px; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));">

        <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: rgb(var(--color-gold));">404 &middot; Page Not Found</div>
        <h1 style="color: #ffffff; font-size: 33px; font-weight: 800; margin: 10px 0 0;">Looks like this page skipped town.</h1>
        <p class="text-gray-300" style="font-size: 1.05rem; line-height: 1.75; margin-top: 14px;">
            Whatever you were looking for isn't here — maybe it moved, maybe the link's stale. Either way, the Don doesn't know this address.
        </p>

        <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
            <a href="/" class="footer-contact-btn">
                <svg class="icon" aria-hidden="true" style="font-size: 15px;"><use href="/img/icons-sprite.svg#fas-house"></use></svg>
                <span>BACK TO HOME</span>
            </a>
            <a href="/socials" class="footer-contact-btn">
                <svg class="icon" aria-hidden="true" style="font-size: 15px;"><use href="/img/icons-sprite.svg#fas-share-nodes"></use></svg>
                <span>FIND ME ELSEWHERE</span>
            </a>
        </div>

        <div style="border-top: 1px solid rgb(var(--color-gold) / 0.7); margin-top: 40px;"></div>

    </div>
</main>

{{ end }}
