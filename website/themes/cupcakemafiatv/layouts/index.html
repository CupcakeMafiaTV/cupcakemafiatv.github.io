{{ define "main" }}

<!-- Slider -->
{{- partial "slider.html" . -}}
<!-- Slider / End -->

<main id="main-content" class="grow lg:pt-0">

  <section class="py-1 lg:py-1 lg:pb-[70px]">
  </section>

  <div class="pb-0 md:pb-20 lg:pb-[60px]">
    <div class="container">
      <div class="mb-10 md:mb-12 lg:mb-16 xl:mb-20">

        <h2 class="text-2.5xl font-bold tracking-tighter text-gray-900 before:text-accent before:content-['.'] dark:text-white sm:text-3.5xl md:text-4xl lg:text-[62px] lg:leading-none">
          Next Events
        </h2>

      </div>

      <div class="divide-y divide-gray-500/20">
        <div class="grid grid-cols-12 gap-x-4 md:gap-x-6 lg:gap-x-7.5 py-11 first:pt-0 last:pb-0">
          <div class="col-span-2 md:col-span-1 lg:col-span-1">
            <time class="flex flex-col text-center text-xs font-bold md:text-base text-white bg-primary" datetime="2022-08-06 21:30">
              <span class="text-2xl lg:text-[32px] md:leading-none h-11 lg:h-[62px] flex items-center justify-center">{{ now.Format "02" }}
              </span>
              <span class="text-white leading-[28px] bg-primary-500">{{ now.Format "January" }}
              </span>
            </time>
          </div>

          <div class="col-span-10 md:col-span-6 lg:col-span-6">
            <h4 class="text-xl lg:text-2xl font-bold text-gray-900 dark:text-white mb-2 lg:mb-2.5">
              <a class="text-gray-900 dark:text-white transition-colors hover:text-accent dark:hover:text-accent" href="_str1-single-event.html">Live Stream</a>
            </h4>
            <div class="lg:leading-[26px]">Mark your calendars for my next scheduled Live Stream on Twitch.TV/CupcakeMafiaTV.</div>
          </div>

          <div class="col-span-full md:col-span-5 md:col-start-8 lg:col-start-8 lg:col-span-5">
            <ul class="flex flex-wrap gap-y-5 pt-7 md:pt-3 lg:pt-3">
              <li class="flex flex-1 flex-col items-center gap-y-3.5 text-center">
                <div>
                  <h5 class="font-bold tracking-tight text-gray-900 dark:text-white lg:text-lg lg:leading-tight"></h5>
                  <span class="text-xs lg:text-sm"></span>
                </div>
                <div class="lg:pt-1">
                  <svg role="img" class="h-5 w-5 fill-accent">
                    <use xlink:href="assets/img/str1/sprite.svg#pin"></use>
                  </svg>
                </div>
              </li>
              <li class="flex flex-1 flex-col items-center gap-y-3.5 text-center">
                <div>
                  <h5 class="font-bold tracking-tight text-gray-900 dark:text-white lg:text-lg lg:leading-tight">7:30PM EST</h5>
                  <span class="text-xs lg:text-sm"></span>
                </div>
                <div class="lg:pt-1">
                  <svg role="img" class="h-5 w-5 fill-accent">
                    <use xlink:href="assets/img/str1/sprite.svg#clock"></use>
                  </svg>
                </div>
              </li>
              <li class="flex flex-1 flex-col items-center gap-y-3.5 text-center">
                <div>
                  <h5 class="font-bold tracking-tight text-gray-900 dark:text-white lg:text-lg lg:leading-tight"></h5>
                  <span class="text-xs lg:text-sm"></span>
                </div>
                <div class="lg:pt-1">
                  <svg role="img" class="h-5 w-5 fill-accent">
                    <use xlink:href="assets/img/str1/sprite.svg#credit-card"></use>
                  </svg>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="">
    <div class="container">

      <div class="mb-10 md:mb-12 lg:mb-16 xl:mb-20">
        <h2 class="text-2.5xl font-bold tracking-tighter text-gray-900 before:text-accent before:content-['.'] dark:text-white sm:text-3.5xl md:text-4xl lg:text-[62px] lg:leading-none">
          Watch Live
        </h2>
      </div>

      <div class="grid grid-cols-12 gap-5 md:gap-6 lg:gap-7.5 mb-7.5">
        <figure class="col-span-full md:row-start-1 md:row-end-2 lg:col-span-8 lg:row-start-1 lg:row-end-3">
          <div id="twitch-embed"></div>
          <script src="https://player.twitch.tv/js/embed/v1.js"></script>
          <script type="text/javascript">
            new Twitch.Player("twitch-embed", {
              width: "100%",
              height: 375,
              parent: ["cupcakemafiatv.github.io", "localhost"],    
              channel: "cupcakemafiatv"
            });
          </script>  
        </figure>
      </div>
    </div>
  </div>

  <!-- New League of Quizzes Section -->
  <div class="pt-10 pb-10 md:pt-16 md:pb-20 lg:pt-[60px] lg:pb-[60px]">
    <div class="container">
      <div class="mb-10 md:mb-12 lg:mb-16 xl:mb-20">
        <h2 class="text-2.5xl font-bold tracking-tighter text-gray-900 before:text-accent before:content-['.'] dark:text-white sm:text-3.5xl md:text-4xl lg:text-[62px] lg:leading-none">
          League of Quizzes
        </h2>
      </div>

      <div class="grid grid-cols-12 gap-5 md:gap-6 lg:gap-7.5 mb-7.5">
        <figure class="col-span-full md:row-start-1 md:row-end-2 lg:col-span-8 lg:row-start-1 lg:row-end-3">
          <!-- Responsive Iframe Wrapper -->
          <div class="relative w-full" style="padding-bottom: 56.25%;">
            <iframe class="absolute top-0 left-0 w-full h-full rounded-lg shadow-lg" src="https://www.youtube.com/embed/fnCxnmSMh9Q?si=9AWeAsNtUWk2CwjJ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
        </figure>
      </div>
    </div>
  </div>

</main>

{{ end }}
