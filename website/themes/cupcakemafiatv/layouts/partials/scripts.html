<script>
  // Mobile hamburger menu toggle (header button -> slide-in nav panel).
  (function initMobileMenuToggle() {
    const siteWrapper = document.querySelector('.js-site-wrapper');
    const menuToggle = document.querySelector('.js-menu-toggle');
    const iconOpen = document.querySelector('.js-menu-toggle-icon-open');
    const iconClose = document.querySelector('.js-menu-toggle-icon-close');
    const mobileMenu = document.querySelector('.js-mobile-menu');
    if (!menuToggle || !mobileMenu) return;

    let isOpen = false;
    const content = document.getElementById('content');
    const footer = document.querySelector('footer');
    const desktop = matchMedia('(min-width: 1024px)');
    function setOpen(open, restoreFocus = false) {
      isOpen = open && !desktop.matches;
      menuToggle.classList.toggle('active', isOpen);
      menuToggle.setAttribute('aria-expanded', String(isOpen));
      menuToggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
      if (siteWrapper) siteWrapper.classList.toggle('overflow-y-hidden', isOpen);
      document.documentElement.classList.toggle('mobile-menu-open', isOpen);
      if (iconOpen) iconOpen.classList.toggle('hidden', isOpen);
      if (iconClose) iconClose.classList.toggle('hidden', !isOpen);
      mobileMenu.inert = !isOpen;
      mobileMenu.setAttribute('aria-hidden', String(!isOpen));
      mobileMenu.classList.toggle('translate-x-full', !isOpen);
      mobileMenu.classList.toggle('translate-x-0', isOpen);
      if (content) content.inert = isOpen;
      if (footer) footer.inert = isOpen;
      if (isOpen) mobileMenu.querySelector('a[href]')?.focus({ preventScroll: true });
      else if (restoreFocus) menuToggle.focus({ preventScroll: true });
    }
    menuToggle.onclick = () => setOpen(!isOpen, isOpen);
    document.addEventListener('keydown', event => {
      if (!isOpen) return;
      if (event.key === 'Escape') { event.preventDefault(); setOpen(false, true); }
      if (event.key === 'Tab') {
        const controls = [menuToggle, ...mobileMenu.querySelectorAll('a[href], button:not([disabled])')];
        const current = controls.indexOf(document.activeElement);
        event.preventDefault();
        controls[(current + (event.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
      }
    });
    mobileMenu.addEventListener('click', event => { if (event.target.closest('a[href]')) setOpen(false, true); });
    desktop.addEventListener('change', () => { if (desktop.matches) setOpen(false); });
    setOpen(false);
  })();

  // Animates an element's text from 0 up to `target`, easing out. Clears
  // any .stat-skeleton shimmer placeholder on the element first. Shared
  // across pages so every live/static stat counts up the same way.
  // `decimals` lets money figures (e.g. "1263.50") count up smoothly too.
  window.cmtvCountUp = function (el, target, duration, decimals) {
    if (!el || !isFinite(target)) return;
    el.classList.remove('stat-skeleton');
    duration = duration || 1200;
    decimals = decimals || 0;
    const format = (n) => n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    if (el.closest('[data-count-animation="none"]') || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = format(target); return; }
    const startTime = performance.now();
    function step(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = format(target * eased);
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        el.textContent = format(target);
      }
    }
    requestAnimationFrame(step);
  };

  // Compact number formatting (850K, 1.2M) for stats shown inline in tight
  // spaces, e.g. the "Subscribers · X Views" card subtitle, where a full
  // comma-separated number would overflow the single-line text.
  window.cmtvFormatCompact = function (n) {
    return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
  };

  // Small DOM-based confetti burst (no external library) fired from a
  // given element's center — used by the Mafia Name Generator.
  window.cmtvConfetti = function (originEl) {
    if (!originEl) return;
    const colors = ['#a855f7', '#38bdf8', '#ef4444', '#22c55e', '#eab308'];
    const rect = originEl.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;
    for (let i = 0; i < 26; i++) {
      const piece = document.createElement('div');
      const size = Math.random() * 6 + 4;
      piece.style.position = 'fixed';
      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
      piece.style.pointerEvents = 'none';
      piece.style.zIndex = '9999';
      document.body.appendChild(piece);

      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 120 + 60;
      const dx = Math.cos(angle) * velocity;
      const dy = Math.sin(angle) * velocity - 80;

      const anim = piece.animate([
        { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 220}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
      ], {
        duration: 900 + Math.random() * 400,
        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
      });
      anim.onfinish = () => piece.remove();
    }
  };

  // Count up static totals on pages that use the animation (e.g.
  // charity stats). Add
  // data-decimals="2" on an element to count up a money figure.
  document.querySelectorAll('.static-count-up').forEach(el => {
    const decimals = parseInt(el.dataset.decimals || '0', 10);
    const target = parseFloat(el.textContent.replace(/,/g, ''));
    if (!isNaN(target)) window.cmtvCountUp(el, target, undefined, decimals);
  });

  // Swaps the browser tab title/favicon to a "live" state while streaming,
  // so a backgrounded tab still announces it. Draws the red dot onto the
  // existing favicon at runtime (via canvas) instead of needing a second
  // favicon asset to keep in sync with the real one.
  const cmtvOriginalTitle = document.title;
  const cmtvFaviconEl = document.querySelector('link[rel="icon"]');
  const cmtvOriginalFaviconHref = cmtvFaviconEl ? cmtvFaviconEl.getAttribute('href') : null;
  let cmtvLiveFaviconDataUrl = null;

  function cmtvBuildLiveFavicon(callback) {
    if (cmtvLiveFaviconDataUrl) { callback(cmtvLiveFaviconDataUrl); return; }
    if (!cmtvFaviconEl || !cmtvOriginalFaviconHref) return;
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 32, 32);
      ctx.beginPath();
      ctx.arc(24, 8, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#1a1128';
      ctx.stroke();
      cmtvLiveFaviconDataUrl = canvas.toDataURL('image/png');
      callback(cmtvLiveFaviconDataUrl);
    };
    img.src = cmtvOriginalFaviconHref;
  }

  function cmtvSetLiveIndicator(isLive) {
    document.title = isLive ? '🔴 LIVE — ' + cmtvOriginalTitle : cmtvOriginalTitle;
    if (!cmtvFaviconEl) return;
    if (isLive) {
      cmtvBuildLiveFavicon((dataUrl) => { cmtvFaviconEl.setAttribute('href', dataUrl); });
    } else if (cmtvOriginalFaviconHref) {
      cmtvFaviconEl.setAttribute('href', cmtvOriginalFaviconHref);
    }
  }

  // Fetch and Toggle Live Status Badges
  let twitchIsLive = false;
  let youtubeIsLive = false;
  let liveCheckPending = false;
  async function checkLiveStatuses() {
    if (liveCheckPending) return;
    liveCheckPending = true;

    // 1. Check Twitch Live Status
    try {
      const twitchRes = await fetch('https://cupcakemafiatv-github-io.vercel.app/api/twitch-status', { signal: AbortSignal.timeout(10000) });
      const twitchData = await twitchRes.json();
      if (!twitchRes.ok || twitchData.available === false || typeof twitchData.isLive !== 'boolean') throw new Error('Twitch status unavailable');
      twitchIsLive = Boolean(twitchData.isLive);

      const twitchBadge = document.getElementById('twitch-live-badge');
      if (twitchBadge) {
        twitchBadge.style.display = twitchIsLive ? 'inline-block' : 'none';
      }

      if (twitchRes.ok && typeof updateHomeStreamState === 'function') {
        updateHomeStreamState(twitchIsLive, twitchData);
      }
    } catch (e) {
      console.log('Error checking Twitch status:', e);
    }

    // 2. Check YouTube Live Status
    try {
      const ytRes = await fetch('https://cupcakemafiatv-github-io.vercel.app/api/youtube-status', { signal: AbortSignal.timeout(10000) });
      const ytData = await ytRes.json();
      if (!ytRes.ok || ytData.error || ytData.stale || typeof ytData.isLive !== 'boolean') throw new Error('YouTube status unavailable');
      youtubeIsLive = ytData.isLive;

      const ytBadge = document.getElementById('youtube-live-badge');
      if (ytBadge) {
        ytBadge.style.display = youtubeIsLive ? 'inline-block' : 'none';
      }
    } catch (e) {
      // Silently fail if not configured yet
    }

    // 3. Nav badge reflects either platform, linking to whichever is live
    // (Twitch takes priority if both are live at once).
    const navBadge = document.getElementById('nav-live-badge');
    if (navBadge) {
      if (twitchIsLive) {
        navBadge.href = 'https://twitch.tv/cupcakemafiatv';
        navBadge.style.display = 'inline-flex';
      } else if (youtubeIsLive) {
        navBadge.href = 'https://youtube.com/@cupcakemafiatv/live';
        navBadge.style.display = 'inline-flex';
      } else {
        navBadge.style.display = 'none';
      }
    }

    // 4. Site-wide "is live" flag other pages/widgets can react to
    // (tab title and favicon here).
    window.cmtvIsLive = twitchIsLive || youtubeIsLive;
    cmtvSetLiveIndicator(window.cmtvIsLive);
    document.dispatchEvent(new CustomEvent('cmtv:livestatus', { detail: { isLive: window.cmtvIsLive } }));
    liveCheckPending = false;
  }

  // Run live check immediately on page load
  checkLiveStatuses();

  // Re-check live status every 5 minutes (300,000 milliseconds). Safe to
  // poll faster than YouTube's actual refresh interval: /api/youtube-status
  // gates real search.list calls behind a shared Redis cache (20 min TTL),
  // not per-visitor Cache-Control, so extra client polls just hit that cache.
  setInterval(checkLiveStatuses, 300000);
</script>
