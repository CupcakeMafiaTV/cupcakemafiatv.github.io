<script>
  // Fetch live YouTube subscriber count
  fetch('https://cupcakemafiatv-github-io.vercel.app/api/subscribers')
    .then(response => response.json())
    .then(data => {
      const subElement = document.getElementById('subscriber-count');
      if (subElement && data.subscriberCount) {
        subElement.textContent = data.subscriberCount;
      }
    })
    .catch(error => console.error('Error fetching subscriber count:', error));

  // Fetch live Twitch follower count from Vercel API
  fetch('https://cupcakemafiatv-github-io.vercel.app/api/twitch-followers')
    .then(response => response.json())
    .then(data => {
      const twitchCountEl = document.getElementById('twitch-follower-count');
      if (twitchCountEl && data.followerCount) {
        twitchCountEl.innerText = Number(data.followerCount).toLocaleString();
      }
    })
    .catch(error => {
      console.error('Error fetching Twitch followers:', error);
    });

  // Fetch and Toggle Live Status Badges
  async function checkLiveStatuses() {
    // 1. Check Twitch Live Status
    try {
      const twitchRes = await fetch('https://cupcakemafiatv-github-io.vercel.app/api/twitch-status');
      const twitchData = await twitchRes.json();
      const twitchBadge = document.getElementById('twitch-live-badge');
      
      if (twitchBadge) {
        twitchBadge.style.display = twitchData.isLive ? 'inline-block' : 'none';
      }
    } catch (e) {
      console.log('Error checking Twitch status:', e);
    }

    // 2. Check YouTube Live Status (Optional)
    try {
      const ytRes = await fetch('https://cupcakemafiatv-github-io.vercel.app/api/youtube-status');
      const ytData = await ytRes.json();
      const ytBadge = document.getElementById('youtube-live-badge');
      
      if (ytBadge) {
        ytBadge.style.display = ytData.isLive ? 'inline-block' : 'none';
      }
    } catch (e) {
      // Silently fail if not configured yet
    }
  }

  // Run live check immediately on page load
  checkLiveStatuses();

  // Re-check live status every 2 minutes (120,000 milliseconds)
  setInterval(checkLiveStatuses, 120000);

  // Fetch and Load Latest YouTube Video
  async function loadLatestVideo() {
      try {
          const response = await fetch('https://cupcakemafiatv-github-io.vercel.app/api/latest-video');
          const data = await response.json();

          if (response.ok && data.videoId) {
              document.getElementById('home-hero-thumbnail').src = data.thumbnail;
              document.getElementById('home-hero-thumbnail').style.display = 'block';
              document.getElementById('home-hero-placeholder').style.display = 'none';
              document.getElementById('home-hero-title').innerText = data.title;
              document.getElementById('home-hero-video-link').href = `https://youtube.com/watch?v=${data.videoId}`;
          } else {
              document.getElementById('home-hero-title').innerText = 'Check out my channel for recent uploads!';
          }
      } catch (error) {
          document.getElementById('home-hero-title').innerText = 'Visit YouTube to watch latest videos';
      }
  }

  // Run latest video load on page load
  loadLatestVideo();
</script>
