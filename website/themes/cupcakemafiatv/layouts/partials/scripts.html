<script>
  // Animates an element's text from 0 up to `target`, easing out. Clears
  // any .stat-skeleton shimmer placeholder on the element first. Shared
  // across pages so every live/static stat counts up the same way.
  // `decimals` lets money figures (e.g. "1263.50") count up smoothly too.
  window.cmtvCountUp = function (el, target, duration, decimals) {
    if (!el || !isFinite(target)) return;
    el.classList.remove('stat-skeleton');
    duration = duration || 1200;
    decimals = decimals || 0;
    const format = (n) => n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    const startTime = performance.now();
    function step(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = format(target * eased);
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        el.textContent = format(target);
      }
    }
    requestAnimationFrame(step);
  };

  // Small DOM-based confetti burst (no external library) fired from a
  // given element's center — used by the Mafia Name Generator.
  window.cmtvConfetti = function (originEl) {
    if (!originEl) return;
    const colors = ['#a855f7', '#38bdf8', '#ef4444', '#22c55e', '#eab308'];
    const rect = originEl.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;
    for (let i = 0; i < 26; i++) {
      const piece = document.createElement('div');
      const size = Math.random() * 6 + 4;
      piece.style.position = 'fixed';
      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
      piece.style.pointerEvents = 'none';
      piece.style.zIndex = '9999';
      document.body.appendChild(piece);

      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 120 + 60;
      const dx = Math.cos(angle) * velocity;
      const dy = Math.sin(angle) * velocity - 80;

      const anim = piece.animate([
        { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 220}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
      ], {
        duration: 900 + Math.random() * 400,
        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
      });
      anim.onfinish = () => piece.remove();
    }
  };

  // Fade/slide sections up as they scroll into view.
  (function initScrollReveal() {
    const revealEls = document.querySelectorAll('.reveal-on-scroll');
    if (!revealEls.length) return;
    if (!('IntersectionObserver' in window)) {
      revealEls.forEach(el => el.classList.add('is-visible'));
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(el => observer.observe(el));
  })();

  // Count up any static number on load (e.g. the X/Instagram/TikTok
  // follower cards on Work With Me, or the charity stats). Add
  // data-decimals="2" on an element to count up a money figure.
  document.querySelectorAll('.static-count-up').forEach(el => {
    const decimals = parseInt(el.dataset.decimals || '0', 10);
    const target = parseFloat(el.textContent.replace(/,/g, ''));
    if (!isNaN(target)) window.cmtvCountUp(el, target, undefined, decimals);
  });

  // Fetch live YouTube subscriber count (falls back to the last known-good
  // value in localStorage if the API is unreachable, so the count never
  // gets stuck on "..."). This one fetch covers every page — the homepage
  // hero and Work With Me's stat card both reuse the same element ID.
  fetch('https://cupcakemafiatv-github-io.vercel.app/api/subscribers')
    .then(response => response.json())
    .then(data => {
      const subElement = document.getElementById('youtube-sub-count');
      if (subElement && data.subscriberCount) {
        window.cmtvCountUp(subElement, Number(data.subscriberCount));
      }
      if (data.subscriberCount) localStorage.setItem('cmtv_youtube_subs', data.subscriberCount);
    })
    .catch(error => {
      console.error('Error fetching subscriber count:', error);
      const subElement = document.getElementById('youtube-sub-count');
      const cached = localStorage.getItem('cmtv_youtube_subs');
      if (subElement && cached) window.cmtvCountUp(subElement, Number(cached));
    });

  // Fetch live Twitch follower count from Vercel API (same fallback pattern)
  fetch('https://cupcakemafiatv-github-io.vercel.app/api/twitch-followers')
    .then(response => response.json())
    .then(data => {
      const twitchCountEl = document.getElementById('twitch-follower-count');
      if (twitchCountEl && data.followerCount) {
        window.cmtvCountUp(twitchCountEl, Number(data.followerCount));
      }
      if (data.followerCount) localStorage.setItem('cmtv_twitch_followers', data.followerCount);
    })
    .catch(error => {
      console.error('Error fetching Twitch followers:', error);
      const twitchCountEl = document.getElementById('twitch-follower-count');
      const cached = localStorage.getItem('cmtv_twitch_followers');
      if (twitchCountEl && cached) window.cmtvCountUp(twitchCountEl, Number(cached));
    });

  // Fetch and Toggle Live Status Badges
  async function checkLiveStatuses() {
    let twitchIsLive = false;
    let youtubeIsLive = false;

    // 1. Check Twitch Live Status
    try {
      const twitchRes = await fetch('https://cupcakemafiatv-github-io.vercel.app/api/twitch-status');
      const twitchData = await twitchRes.json();
      twitchIsLive = Boolean(twitchData.isLive);

      const twitchBadge = document.getElementById('twitch-live-badge');
      if (twitchBadge) {
        twitchBadge.style.display = twitchIsLive ? 'inline-block' : 'none';
      }
    } catch (e) {
      console.log('Error checking Twitch status:', e);
    }

    // 2. Check YouTube Live Status
    try {
      const ytRes = await fetch('https://cupcakemafiatv-github-io.vercel.app/api/youtube-status');
      const ytData = await ytRes.json();
      youtubeIsLive = Boolean(ytData.isLive);

      const ytBadge = document.getElementById('youtube-live-badge');
      if (ytBadge) {
        ytBadge.style.display = youtubeIsLive ? 'inline-block' : 'none';
      }
    } catch (e) {
      // Silently fail if not configured yet
    }

    // 3. Nav badge reflects either platform, linking to whichever is live
    // (Twitch takes priority if both are live at once).
    const navBadge = document.getElementById('nav-live-badge');
    if (navBadge) {
      if (twitchIsLive) {
        navBadge.href = 'https://twitch.tv/cupcakemafiatv';
        navBadge.style.display = 'inline-flex';
      } else if (youtubeIsLive) {
        navBadge.href = 'https://youtube.com/@cupcakemafiatv/live';
        navBadge.style.display = 'inline-flex';
      } else {
        navBadge.style.display = 'none';
      }
    }
  }

  // Run live check immediately on page load
  checkLiveStatuses();

  // Re-check live status every 2 minutes (120,000 milliseconds)
  setInterval(checkLiveStatuses, 120000);
</script>
