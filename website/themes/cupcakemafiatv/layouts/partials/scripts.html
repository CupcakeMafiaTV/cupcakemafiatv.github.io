<script>
  fetch('https://cupcakemafiatv-github-io.vercel.app/api/subscribers')
    .then(response => response.json())
    .then(data => {
      const subElement = document.getElementById('subscriber-count');
      if (subElement && data.subscriberCount) {
        subElement.textContent = data.subscriberCount;
      }
    })
    .catch(error => console.error('Error fetching subscriber count:', error));


// Fetch live Twitch follower count from Vercel API
  fetch('https://cupcakemafiatv-github-io.vercel.app/api/twitch-followers')
    .then(response => response.json())
    .then(data => {
      document.getElementById('twitch-follower-count').innerText = Number(data.followerCount).toLocaleString();
    })
    .catch(error => {
      console.error('Error fetching Twitch followers:', error);
    });

    </script>
