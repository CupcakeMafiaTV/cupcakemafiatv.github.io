<!-- Inline privacy preferences; no popup. Analytics remains opt-in. -->
<div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
  <button type="button" id="analytics-enable" style="padding:10px 16px;border:1px solid #d4ad62;border-radius:8px;color:white">Enable analytics</button>
  <button type="button" id="analytics-disable" style="padding:10px 16px;border:1px solid #d4ad62;border-radius:8px;color:white">Disable analytics</button>
  <p id="analytics-preference" role="status"></p>
</div>
<script>
(() => {
  const status = document.getElementById('analytics-preference');
  const key = 'cmtv-cookie-consent';
  function show() { let enabled = false; try { enabled = localStorage.getItem(key) === 'accepted'; } catch {} status.textContent = enabled ? 'Analytics enabled in this browser.' : 'Analytics disabled in this browser.'; }
  function choose(enabled) {
    try { localStorage.setItem(key, enabled ? 'accepted' : 'declined'); }
    catch { status.textContent = 'Your browser could not save this preference.'; return; }
    // Reload also stops an already-loaded analytics script when opting out.
    location.reload();
  }
  document.getElementById('analytics-enable').onclick = () => choose(true);
  document.getElementById('analytics-disable').onclick = () => choose(false);
  show();
})();
</script>
