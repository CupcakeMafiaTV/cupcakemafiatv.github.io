<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Basic Page Needs -->
  {{ $title := print .Site.Title " | " .Title }}
  {{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
  
  <title>{{ $title }}</title>
  <meta name="description" content="Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community.">
  <meta name="author" content="CupcakeMafiaTV">
  <meta name="keywords" content="CupcakeMafiaTV, Twitch, Gaming, Streamer, Content Creator">

  <!-- Open Graph / Social Share -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CupcakeMafiaTV">
  <meta property="og:title" content="{{ $title }}">
  <meta property="og:description" content="Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community.">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "img/logo.png" | absURL }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ $title }}">
  <meta name="twitter:description" content="Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community.">
  <meta name="twitter:image" content="{{ "img/logo.png" | absURL }}">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/img/logo.png">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Vendor CSS -->
  <link href="/common/glightbox/css/glightbox.min.css" rel="stylesheet">

  <!-- Template CSS -->
  <link href="/css/style.css" rel="stylesheet">

  <!-- Custom Header & Navigation Overrides -->
  <style>
      @keyframes navLivePulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
      }

      /* Force header container width & centering across all pages */
      #site-header,
      header {
          max-width: 1400px !important;
          margin-left: auto !important;
          margin-right: auto !important;
          padding-left: 24px !important;
          padding-right: 24px !important;
      }

      /* Match Header Font Size to Footer (20px) */
      #site-header nav a,
      .main-nav a {
          font-size: 20px !important;
          font-weight: 700 !important;
          transition: color 0.2s ease-in-out;
          padding-left: 0 !important;
      }

      /* Hide all pseudo-element markers/boxes completely */
      #site-header nav a::after,
      #site-header nav a::before,
      .main-nav a::after,
      .main-nav a::before,
      ul li a::after,
      ul li a::before {
          display: none !important;
          content: none !important;
      }

      /* Hover Glow Effect for Links */
      #site-header nav a:hover,
      .main-nav a:hover {
          color: #f97316 !important;
      }
  </style>
</head>
