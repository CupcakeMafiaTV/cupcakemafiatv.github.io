<head>

  <!-- Basic Page Needs
  ================================================== -->
  {{ $title := print .Site.Title " | " .Title }}
  {{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
  
  <title>{{ $title }}</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community.">
  <meta name="author" content="CupcakeMafiaTV">
  <meta name="keywords" content="CupcakeMafiaTV, Twitch, Gaming, Streamer, Content Creator">

  <!-- Favicons
  ================================================== -->
  <link rel="shortcut icon" href="/img/favicons/favicon.ico">
  
  <!-- Mobile Specific Metas
  ================================================== -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">

  <!-- Google Web Fonts
  ================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CSS
  ================================================== -->
  
  <!-- Vendor CSS-->
  <link href="/common/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="/common/swiper/css/swiper-bundle.min.css" rel="stylesheet">

  <!-- Template CSS-->
  <link href="/css/style.css" rel="stylesheet">

  <!-- Custom Header & Navigation Overrides -->
  <style>
      /* Match Header Font Size to Footer (20px) */
      #site-header nav a,
      .main-nav a {
          font-size: 20px !important;
          font-weight: 700 !important;
      }

      /* Recolor Navigation Arrows to Orange */
      #site-header nav a::before,
      .main-nav a::before,
      #site-header nav .arrow,
      .main-nav .arrow,
      #site-header nav svg,
      .main-nav svg {
          color: #f97316 !important;  /* Bright brand orange */
          fill: #f97316 !important;
      }

      /* Hover Glow Effect for Links */
      #site-header nav a:hover {
          color: #f97316 !important;
          transition: color 0.2s ease-in-out;
      }
  </style>

</head>
