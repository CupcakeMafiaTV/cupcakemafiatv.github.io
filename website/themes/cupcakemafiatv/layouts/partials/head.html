<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZZSLEPQDX3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-ZZSLEPQDX3');
  </script>

  <!-- Basic Page Needs -->
  {{ $title := print .Site.Title " | " .Title }}
  {{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}

  {{ $description := "Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community." }}
  {{ with .Description }}{{ $description = . }}{{ end }}

  <title>{{ $title }}</title>
  <meta name="description" content="{{ $description }}">
  <meta name="author" content="CupcakeMafiaTV">

  <!-- Structured Data (Person) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Cody",
    "alternateName": "CupcakeMafiaTV",
    "url": "{{ .Site.BaseURL }}",
    "image": "{{ "img/CodyWeirdAl.jpg" | absURL }}",
    "jobTitle": "Twitch Streamer",
    "description": "{{ $description }}",
    "sameAs": [
      "https://twitch.tv/cupcakemafiatv",
      "https://youtube.com/@cupcakemafiatv",
      "https://x.com/cupcakemafiatv",
      "https://instagram.com/cupcakemafiatv",
      "https://www.tiktok.com/@cupcakemafiatv",
      "https://discord.com/invite/DPjsCV6RMj"
    ]
  }
  </script>

  <!-- Open Graph / Social Share -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CupcakeMafiaTV">
  <meta property="og:title" content="{{ $title }}">
  <meta property="og:description" content="{{ $description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "img/og-image.png" | absURL }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ $title }}">
  <meta name="twitter:description" content="{{ $description }}">
  <meta name="twitter:image" content="{{ "img/og-image.png" | absURL }}">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon-180.png">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Vendor CSS -->
  <link href="/common/glightbox/css/glightbox.min.css" rel="stylesheet">

  <!-- Template CSS -->
  <link href="/css/style.css" rel="stylesheet">

  <!-- Custom Header & Navigation Overrides -->
  <style>
      @keyframes navLivePulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
      }

      /* Force header container width & centering across all pages */
      #site-header,
      header {
          max-width: 1400px !important;
          margin-left: auto !important;
          margin-right: auto !important;
          padding-left: 24px !important;
          padding-right: 24px !important;
      }

      /* Match Header Font Size to Footer (18px) */
      #site-header nav a,
      .main-nav a {
          font-size: 18px !important;
          font-weight: 700 !important;
          transition: color 0.2s ease-in-out;
          padding-left: 0 !important;
      }

      /* Hide all pseudo-element markers/boxes completely */
      #site-header nav a::after,
      #site-header nav a::before,
      .main-nav a::after,
      .main-nav a::before,
      ul li a::after,
      ul li a::before {
          display: none !important;
          content: none !important;
      }

      /* Hover Glow Effect for Links */
      #site-header nav a:hover:not(.header-social-icon),
      .main-nav a:hover:not(.header-social-icon) {
          color: rgb(var(--color-accent)) !important;
      }

      /* Brand-Colored Header Social Icons (permanent circle badges, matches footer style) */
      #site-header .header-social-icon {
          display: inline-flex !important;
          align-items: center;
          justify-content: center;
          width: 36px !important;
          height: 36px !important;
          border-radius: 9999px !important;
          color: #ffffff !important;
          font-size: 15px !important;
          border: 2px solid #ffffff;
          transition: all 0.2s ease-in-out;
      }

      #site-header .header-social-icon:hover {
          transform: translateY(-2px);
      }

      #site-header .header-social-icon.header-social-twitch { background-color: #9146FF !important; }
      #site-header .header-social-icon.header-social-youtube { background-color: #FF0000 !important; }
      #site-header .header-social-icon.header-social-x { background-color: #000000 !important; }
      #site-header .header-social-icon.header-social-instagram { background-color: #D62976 !important; font-size: 19px !important; }
      #site-header .header-social-icon.header-social-tiktok { background-color: #000000 !important; }
      #site-header .header-social-icon.header-social-discord { background-color: #5865F2 !important; }

      /* Shared "Brand Card" component — used on Work With Me, Socials, and
         PC Specs so every link/stat tile across the site looks the same:
         neutral dark card, a persistent brand/category-colored border set
         inline per card, an icon chip, and a title/subtitle pair. */
      .brand-card {
          position: relative;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 16px 18px;
          border-radius: 14px;
          background-color: rgba(17, 24, 39, 0.6);
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
          text-decoration: none !important;
          transition: transform 0.25s ease, background-color 0.25s ease;
      }
      .brand-card:hover {
          transform: translateY(-3px);
          background-color: rgba(17, 24, 39, 0.85);
      }
      .brand-card-icon {
          width: 40px;
          height: 40px;
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 18px;
          flex-shrink: 0;
      }
      .brand-card-body { overflow: hidden; flex: 1; min-width: 0; }
      .brand-card-title {
          color: #ffffff;
          font-weight: 700;
          font-size: 15px;
          line-height: 1.25;
          margin-bottom: 2px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }
      .brand-card-title-lg { font-size: 1.85rem; font-weight: 900; margin-bottom: 4px; }
      .brand-card-subtitle {
          font-size: 12px;
          font-weight: 500;
          color: #94a3b8;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }
      .brand-card-ext {
          position: absolute;
          top: 10px;
          right: 12px;
          font-size: 11px;
          color: #ffffff;
          opacity: 0.85;
          pointer-events: none;
      }
      .brand-card-badge {
          flex-shrink: 0;
          padding: 2px 6px;
          font-size: 9px;
          font-weight: 800;
          background: #ef4444;
          color: #ffffff;
          border-radius: 4px;
          text-transform: uppercase;
      }

      /* Scroll-reveal: sections fade/slide up as they enter the viewport.
         Toggled by IntersectionObserver in scripts.html. */
      .reveal-on-scroll {
          opacity: 0;
          transform: translateY(24px);
          transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .reveal-on-scroll.is-visible {
          opacity: 1;
          transform: translateY(0);
      }

      /* Shimmer skeleton shown in place of "..." while a live stat is
         still loading; swapped out by cmtvCountUp() once data arrives. */
      .stat-skeleton {
          display: inline-block;
          width: 3.5em;
          height: 1em;
          border-radius: 4px;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0.08) 25%, rgba(255, 255, 255, 0.18) 37%, rgba(255, 255, 255, 0.08) 63%);
          background-size: 400% 100%;
          animation: statShimmer 1.4s ease infinite;
          vertical-align: middle;
      }
      @keyframes statShimmer {
          0% { background-position: 100% 50%; }
          100% { background-position: 0 50%; }
      }

      /* Shared "Category Header" component — an icon chip plus label and a
         gradient line tinted to match, used above groups of cards (PC Specs
         categories, About's Favorite Games, etc). */
      .category-header {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-top: 22px;
          margin-bottom: 4px;
      }
      .category-header:first-child {
          margin-top: 0;
      }
      .category-header-icon {
          width: 28px;
          height: 28px;
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 13px;
          flex-shrink: 0;
      }
      .category-header-label {
          font-size: 14px;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #ffffff;
          white-space: nowrap;
      }
      .category-header-line {
          flex: 1;
          height: 1px;
          background: linear-gradient(90deg, var(--cat-color, rgba(255, 255, 255, 0.4)) 0%, transparent 100%);
      }

      /* Visible keyboard-focus ring. Most interactive elements on the site
         are custom link-cards that only had :hover feedback, so a
         keyboard-only visitor had no way to see where focus currently is.
         :focus-visible (not :focus) keeps this from showing on mouse clicks. */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      [tabindex]:focus-visible {
          outline: 2px solid rgb(var(--color-accent));
          outline-offset: 3px;
          border-radius: 4px;
      }
  </style>
</head>
