<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Basic Page Needs -->
  {{ $title := print .Site.Title " | " .Title }}
  {{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
  
  <title>{{ $title }}</title>
  <meta name="description" content="Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community.">
  <meta name="author" content="CupcakeMafiaTV">
  <meta name="keywords" content="CupcakeMafiaTV, Twitch, Gaming, Streamer, Content Creator">

  <!-- Open Graph / Social Share -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CupcakeMafiaTV">
  <meta property="og:title" content="{{ $title }}">
  <meta property="og:description" content="Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community.">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "img/logo.png" | absURL }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ $title }}">
  <meta name="twitter:description" content="Official website for CupcakeMafiaTV - Streaming, Content Creation, and Community.">
  <meta name="twitter:image" content="{{ "img/logo.png" | absURL }}">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/img/logo.png">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Vendor CSS -->
  <link href="/common/glightbox/css/glightbox.min.css" rel="stylesheet">

  <!-- Template CSS -->
  <link href="/css/style.css" rel="stylesheet">

  <!-- Custom Header & Navigation Overrides -->
  <style>
      @keyframes navLivePulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
      }

      /* Force header container width & centering across all pages */
      #site-header,
      header {
          max-width: 1400px !important;
          margin-left: auto !important;
          margin-right: auto !important;
          padding-left: 24px !important;
          padding-right: 24px !important;
      }

      /* Match Header Font Size to Footer (18px) */
      #site-header nav a,
      .main-nav a {
          font-size: 18px !important;
          font-weight: 700 !important;
          transition: color 0.2s ease-in-out;
          padding-left: 0 !important;
      }

      /* Hide all pseudo-element markers/boxes completely */
      #site-header nav a::after,
      #site-header nav a::before,
      .main-nav a::after,
      .main-nav a::before,
      ul li a::after,
      ul li a::before {
          display: none !important;
          content: none !important;
      }

      /* Hover Glow Effect for Links */
      #site-header nav a:hover,
      .main-nav a:hover {
          color: rgb(var(--color-accent)) !important;
      }

      /* Brand-Colored Header Social Icons (permanent circle badges, matches footer style) */
      #site-header .header-social-icon {
          display: inline-flex !important;
          align-items: center;
          justify-content: center;
          width: 36px !important;
          height: 36px !important;
          border-radius: 9999px !important;
          color: #ffffff !important;
          font-size: 15px !important;
          border: 2px solid #ffffff;
          transition: all 0.2s ease-in-out;
      }

      #site-header .header-social-icon:hover {
          transform: translateY(-2px);
      }

      #site-header .header-social-icon.header-social-twitch { background-color: #9146FF !important; }
      #site-header .header-social-icon.header-social-youtube { background-color: #FF0000 !important; }
      #site-header .header-social-icon.header-social-x { background-color: #000000 !important; }
      #site-header .header-social-icon.header-social-instagram { background-color: #D62976 !important; font-size: 17px !important; }
      #site-header .header-social-icon.header-social-tiktok { background-color: #000000 !important; }
      #site-header .header-social-icon.header-social-discord { background-color: #5865F2 !important; }

      #site-header .header-social-icon.header-social-twitch:hover { box-shadow: 0 0 8px rgba(145, 70, 255, 0.6); }
      #site-header .header-social-icon.header-social-youtube:hover { box-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }
      #site-header .header-social-icon.header-social-x:hover { box-shadow: 0 0 8px rgba(255, 255, 255, 0.35); }
      #site-header .header-social-icon.header-social-instagram:hover { box-shadow: 0 0 8px rgba(214, 41, 118, 0.6); }
      #site-header .header-social-icon.header-social-tiktok:hover { box-shadow: 0 0 8px rgba(255, 255, 255, 0.35); }
      #site-header .header-social-icon.header-social-discord:hover { box-shadow: 0 0 8px rgba(88, 101, 242, 0.6); }
  </style>
</head>
