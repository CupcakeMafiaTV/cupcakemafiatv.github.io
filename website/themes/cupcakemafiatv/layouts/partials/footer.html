<footer id="site-footer">
  <div class="container">

    <div class="grid grid-cols-12 gap-x-5 gap-y-9 border-t border-gray-500/20 py-16 md:gap-x-6 lg:gap-x-7.5 lg:pt-[75px] lg:pb-[66px] items-center">

      <!-- Navigation Links (All in a single row) -->
      <div class="col-span-full lg:col-span-8">
        <div>
          <nav>
            <ul class="flex flex-wrap items-center gap-x-6 gap-y-3 text-sm font-bold">
              {{ range .Site.Menus.main }}
              <li>
                <a class="text-gray-900 transition-colors hover:text-accent dark:text-white dark:hover:text-accent" href="{{ .URL }}">{{ .Name }}</a>
              </li>
              {{ end }}
            </ul>
          </nav>
        </div>
      </div>

      <!-- Business Email Button -->
      <div class="col-span-full lg:col-span-4">
        <div class="pt-1">
          <a href="mailto:your-email@example.com" class="inline-flex text-center font-bold leading-none transition-colors uppercase justify-center gap-x-3 py-4 px-4 md:py-[18px] lg:px-8 text-sm text-white bg-gray-800 hover:bg-gray-700 border border-gray-600 w-full">
            <svg class="h-[14px] w-[14px]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            Business Email
          </a>
        </div>
      </div>

    </div>

  </div>
</footer>
