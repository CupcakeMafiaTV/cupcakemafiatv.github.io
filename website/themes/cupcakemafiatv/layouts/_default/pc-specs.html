<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Consoles</title>
    <!-- Font Awesome Kit / CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            color: #ffffff;
        }

        .category-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #f8fafc;
        }

        .spec-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background-color: #1e293b;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 10px;
            transition: background-color 0.2s ease;
        }

        .spec-card:hover {
            background-color: #334155;
        }

        .ext-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 12px;
            color: #64748b;
        }

        .console-icon {
            background-color: #334155;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Category: Consoles -->
    <div class="category-header">Gaming Consoles</div>

    <!-- PlayStation 5 -->
    <a href="https://www.playstation.com/en-ca/ps5/" target="_blank" rel="noopener noreferrer" class="spec-card card-console">
        <i class="fa-solid fa-arrow-up-right-from-square ext-icon"></i>
        <div class="console-icon" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0;">
            <i class="fa-brands fa-playstation"></i>
        </div>
        <div style="overflow: hidden;">
            <div class="spec-title" style="color: #ffffff; font-weight: 700; font-size: 15px; line-height: 1.2;">
                PlayStation 5
            </div>
            <div style="font-size: 12px; color: #94a3b8; font-weight: 500; margin-top: 3px;">Console</div>
        </div>
    </a>

    <!-- Nintendo Switch 2 -->
    <a href="https://www.nintendo.com/" target="_blank" rel="noopener noreferrer" class="spec-card card-console">
        <i class="fa-solid fa-arrow-up-right-from-square ext-icon"></i>
        <div class="console-icon" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0;">
            <i class="fa-solid fa-gamepad"></i>
        </div>
        <div style="overflow: hidden;">
            <div class="spec-title" style="color: #ffffff; font-weight: 700; font-size: 15px; line-height: 1.2;">
                Nintendo Switch 2
            </div>
            <div style="font-size: 12px; color: #94a3b8; font-weight: 500; margin-top: 3px;">Console</div>
        </div>
    </a>

    <!-- Nintendo 3DS XL -->
    <a href="https://www.nintendo.com/" target="_blank" rel="noopener noreferrer" class="spec-card card-console">
        <i class="fa-solid fa-arrow-up-right-from-square ext-icon"></i>
        <div class="console-icon" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0;">
            <i class="fa-solid fa-gamepad"></i>
        </div>
        <div style="overflow: hidden;">
            <div class="spec-title" style="color: #ffffff; font-weight: 700; font-size: 15px; line-height: 1.2;">
                Nintendo 3DS XL
            </div>
            <div style="font-size: 12px; color: #94a3b8; font-weight: 500; margin-top: 3px;">Console</div>
        </div>
    </a>

</body>
</html>
