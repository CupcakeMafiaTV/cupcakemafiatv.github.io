<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Setup</title>
    <!-- Font Awesome for Logos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .grid { display: flex; gap: 20px; flex-wrap: wrap; }
        
        .spec-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            position: relative;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            width: 220px;
        }

        /* External Link Arrow Indicator */
        .spec-card .ext-icon {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 11px;
            color: #ffffff; 
            opacity: 1;     
            transition: all 0.2s ease;
        }

        /* Image/Content Container */
        .img-container {
            border: 2px solid #444;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            background: #181818;
        }

        /* Hover Effect */
        .img-container:hover {
            transform: translateY(-3px);
            border-color: #ffffff; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(255, 255, 255, 0.2);
        }

        .img-container i {
            font-size: 24px;
        }

        h3 { 
            margin: 0; 
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="grid">
    <!-- PlayStation Card -->
    <div class="spec-card">
        <span class="ext-icon">↗</span>
        <div class="img-container">
            <i class="fa-brands fa-playstation"></i>
            <h3>PlayStation 5</h3>
        </div>
    </div>

    <!-- Nintendo Switch Card -->
    <div class="spec-card">
        <span class="ext-icon">↗</span>
        <div class="img-container">
            <i class="fa-solid fa-gamepad"></i>
            <h3>Nintendo Switch</h3>
        </div>
    </div>
</div>

</body>
</html>
