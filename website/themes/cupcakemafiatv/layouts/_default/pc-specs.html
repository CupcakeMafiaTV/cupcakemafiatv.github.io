<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Setup</title>
    <!-- Font Awesome for Playstation/Nintendo Logos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        
        .spec-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            position: relative;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        /* Updated External Link Arrow Indicators */
        .spec-card .ext-icon {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 11px;
            color: #ffffff; 
            opacity: 1;     
            transition: all 0.2s ease;
        }

        /* Updated Image Hover Effect */
        .img-container:hover {
            transform: translateY(-3px);
            border-color: #ffffff; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(255, 255, 255, 0.2);
        }

        .img-container {
            border: 2px solid #444;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        h3 { margin-top: 10px; }
        i { margin-right: 8px; }
    </style>
</head>
<body>

<div class="grid">
    <!-- Example Console Card -->
    <div class="spec-card">
        <span class="ext-icon">↗</span>
        <div class="img-container">
            <i class="fa-brands fa-playstation"></i>
            <h3>PlayStation 5</h3>
        </div>
    </div>

    <div class="spec-card">
        <span class="ext-icon">↗</span>
        <div class="img-container">
            <i class="fa-brands fa-nintendo-switch"></i>
            <h3>Nintendo Switch</h3>
        </div>
    </div>
</div>

</body>
</html>
