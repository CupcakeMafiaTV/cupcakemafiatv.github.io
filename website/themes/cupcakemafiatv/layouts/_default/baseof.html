<!DOCTYPE html>

<html lang="zxx" class="h-full overflow-x-hidden dark">

    {{- partial "head.html" . -}}

    <body class="relative z-10 antialiased font-base text-gray-500 text-sm font-medium lg:text-base h-full bg-white dark:bg-gray-900 overflow-x-hidden dark:text-gray" style="background-color: #0f172a; background-image: radial-gradient(at 15% 25%, rgba(168, 85, 247, 0.12) 0px, transparent 45%), radial-gradient(at 85% 75%, rgba(56, 189, 248, 0.12) 0px, transparent 45%), radial-gradient(at 50% 50%, rgba(239, 68, 68, 0.05) 0px, transparent 60%); background-attachment: fixed;">

        <div id="site-wrapper" class="flex flex-col h-full js-site-wrapper">        
        
            <div class="header-wrapper text-white">

                <header id="site-header" class="text-white">

                    <div class="max-w-[1360px] mx-auto px-5">

                        <nav class="flex min-h-[64px] items-center gap-x-6 lg:gap-x-11 py-1 lg:min-h-[90px] lg:py-4">

                            <!-- Logo -->
                            {{- partial "logo.html" . -}}
                            <!-- Logo / End -->
        
                            <!-- Navigation (Desktop) -->
                            {{- partial "navigation.html" . -}}
                            <!-- Navigation (Desktop) / End -->

                            <!-- Header Controls -->
                            <div class="flex items-center ml-auto -mr-3">
                                <a id="nav-live-badge" href="https://twitch.tv/cupcakemafiatv" target="_blank" rel="noopener noreferrer" class="hidden px-2.5 py-1 rounded-full text-xs font-bold uppercase" style="align-items: center; gap: 6px; margin-right: 12px; letter-spacing: 0.025em; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;">
                                    <span style="display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background: #ef4444; animation: navLivePulse 2s infinite;"></span> Live
                                </a>
                                <button class="js-menu-toggle -mr-2 inline-flex py-4 px-2 sm:px-3 lg:hidden xl:px-4">
                                <svg role="img" class="js-menu-toggle-icon-open h-6 w-6 fill-gray-900 dark:fill-white">
                                    <use xlink:href="/img/sprites2.svg#menu"></use>
                                </svg>
                                <svg role="img" class="js-menu-toggle-icon-close hidden h-6 w-6 fill-gray-900 dark:fill-white">
                                    <use xlink:href="/img/sprites2.svg#menu-close"></use>
                                </svg>
                                </button>
                            </div>
                            <!-- Header Controls / End -->

                        </nav>

                    </div>
                
                </header>

            </div>

            <!-- Mobile Menu -->
            {{- partial "mobile_menu.html" . -}}
            <!-- Mobile Menu / End -->
            
            <div id="content">
            {{- block "main" . }}{{- end }}
            </div>

            {{- partial "footer.html" . -}}
            {{- partial "scripts.html" . -}}

        </div>

        {{- partial "socials.html" . -}}

    </body>

</html>
