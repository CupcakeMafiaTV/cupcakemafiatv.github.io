<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Social Card Base Style */
        .social-card {
            position: relative;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .social-card:hover {
            background-color: #334155;
            transform: translateY(-2px);
        }

        /* External Link Icon */
        .external-link-icon {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #94a3b8;
        }

        .social-card:hover .external-link-icon {
            opacity: 1;
        }

        /* Live Badge Example */
        .live-badge {
            background-color: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container" id="social-container">
        <!-- Social cards will be dynamically injected here via script -->
    </div>

    <script>
        // Data for your social links
        const socialLinks = [
            {
                name: "Twitch",
                url: "https://www.twitch.tv/cupcakemafiatv",
                iconClass: "fa-brands fa-twitch",
                iconColor: "#a855f7",
                description: "Catch stream live broadcasts",
                isLive: true,
                liveId: "twitch-live-badge"
            },
            {
                name: "Twitter / X",
                url: "https://twitter.com",
                iconClass: "fa-brands fa-x-twitter",
                iconColor: "#ffffff",
                description: "Follow for daily updates",
                isLive: false
            },
            {
                name: "YouTube",
                url: "https://youtube.com",
                iconClass: "fa-brands fa-youtube",
                iconColor: "#ef4444",
                description: "Watch recent VODs and clips",
                isLive: false
            }
        ];

        // Function to render cards
        function renderSocialCards() {
            const container = document.getElementById('social-container');
            
            let htmlContent = '';

            socialLinks.forEach(link => {
                htmlContent += `
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="social-card">
                        <!-- External Link Notifier Icon -->
                        <i class="fa-solid fa-arrow-up-right-from-square external-link-icon"></i>
                        
                        <div style="display: flex; align-items: center; gap: 14px; overflow: hidden;">
                            <div style="font-size: 24px; color: ${link.iconColor}; display: flex; align-items: center; justify-content: center; width: 28px; flex-shrink: 0;">
                                <i class="${link.iconClass}"></i>
                            </div>
                            <div style="overflow: hidden;">
                                <div style="color: #ffffff; font-weight: 700; font-size: 15px; line-height: 1.2; margin-bottom: 3px;">${link.name}</div>
                                <div style="color: #94a3b8; font-size: 12px; line-height: 1.2; font-weight: 400;">${link.description}</div>
                            </div>
                        </div>
                        ${link.isLive ? `<span id="${link.liveId}" class="live-badge">LIVE</span>` : ''}
                    </a>
                `;
            });

            container.innerHTML = htmlContent;
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', renderSocialCards);
    </script>
</body>
</html>
