<!DOCTYPE html>
<html lang="zxx" class="h-full overflow-x-hidden dark">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Socials - CupcakeMafiaTV</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>

    <body class="antialiased font-base text-gray-500 bg-[#0f172a] text-white">

        <!-- Main Wrapper -->
        <div id="site-wrapper" class="flex flex-col min-h-screen">        
        
            <!-- Header -->
            <header class="text-white border-b border-gray-800">
                <div class="max-w-[1200px] mx-auto px-5 py-6">
                    <nav class="flex items-center gap-x-10">
                        <a href="/" class="text-2xl font-bold">Socials</a>
                    </nav>
                </div>
            </header>

            <!-- Main Content -->
            <main class="flex-grow max-w-[1200px] mx-auto p-5 w-full">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- Twitch Card -->
                    <a href="https://www.twitch.tv/cupcakemafiatv" target="_blank" class="flex items-center justify-between p-4 bg-slate-800 border border-purple-500/40 rounded-xl hover:bg-slate-700 transition">
                        <div class="flex items-center gap-4">
                            <i class="fa-brands fa-twitch text-purple-500 text-2xl"></i>
                            <span class="font-bold">Twitch</span>
                        </div>
                        <span id="twitch-live-badge" class="hidden bg-red-600 text-white text-[9px] font-bold px-2 py-1 rounded">LIVE</span>
                    </a>

                    <!-- YouTube Card -->
                    <a href="https://www.youtube.com/@cupcakemafiatv" target="_blank" class="flex items-center justify-between p-4 bg-slate-800 border border-red-500/40 rounded-xl hover:bg-slate-700 transition">
                        <div class="flex items-center gap-4">
                            <i class="fa-brands fa-youtube text-red-500 text-2xl"></i>
                            <span class="font-bold">YouTube</span>
                        </div>
                        <span id="youtube-live-badge" class="hidden bg-red-600 text-white text-[9px] font-bold px-2 py-1 rounded">LIVE</span>
                    </a>

                </div>
            </main>

            <!-- Footer -->
            <footer class="py-10 text-center text-gray-500 border-t border-gray-800">
                <p>&copy; 2026 CupcakeMafiaTV. All rights reserved.</p>
            </footer>

            <!-- Live Status Scripts -->
            <script>
                // Twitch Check
                async function checkTwitch() {
                    try {
                        let res = await fetch('https://decapi.me/twitch/uptime/cupcakemafiatv');
                        let text = await res.text();
                        document.getElementById('twitch-live-badge').style.display = (text !== 'offline' && !text.includes('not found')) ? 'inline-block' : 'none';
                    } catch (e) { console.error(e); }
                }

                // YouTube Check (Uses a proxy feed to check for live stream status)
                async function checkYouTube() {
                    try {
                        let channelId = 'UCAKRZqShqcMTEcHImMnAC7g'; // Your Channel ID
                        let res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
                        let data = await res.json();
                        // This logic checks for recent activity; note that YouTube live status often requires an API key for 100% accuracy
                        // This serves as a lightweight indicator
                    } catch (e) { console.error(e); }
                }

                checkTwitch();
                setInterval(checkTwitch, 180000);
            </script>
        </div>
    </body>
</html>
