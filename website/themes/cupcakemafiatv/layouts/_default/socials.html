            <!-- Script to check Twitch live status dynamically using DecAPI -->
            <script>
                async function checkTwitchLiveStatus() {
                    try {
                        let channelName = "cupcakemafiatv";
                        let response = await fetch(`https://decapi.me/twitch/uptime/${channelName}`);
                        let text = await response.text();

                        let badge = document.getElementById("twitch-live-badge");
                        if (badge) {
                            if (!text.includes("offline") && !text.includes("not found")) {
                                badge.style.display = "inline-block"; // Shows when live
                            } else {
                                badge.style.display = "none"; // Hides when offline
                            }
                        }
                    } catch (error) {
                        console.error("Failed to check Twitch live status", error);
                    }
                }

                // Check on page load
                checkTwitchLiveStatus();

                // Re-check every 3 minutes (180000 ms)
                setInterval(checkTwitchLiveStatus, 180000);
            </script>
