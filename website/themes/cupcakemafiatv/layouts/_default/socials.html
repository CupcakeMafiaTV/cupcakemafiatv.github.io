<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 450px;
            background-color: #000;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        dialog {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Stream</h1>
        
        <!-- YouTube Lazy Load Container -->
        <div class="video-container" id="video-box" onclick="loadYouTubeVideo(this)">
            <img src="https://img.youtube.com/vi/KN3OYwP8nHE/hqdefault.jpg" alt="Jinx Video Thumbnail">
        </div>
    </div>

    <!-- Modal for images -->
    <dialog id="img-modal">
        <form method="dialog">
            <button onclick="closeModal()" style="float: right;">Close</button>
        </form>
        <img id="img-modal-img" src="" alt="Modal Image" style="max-width: 100%; margin-top: 10px;">
    </dialog>

    <script>
        // YouTube Lazy Loader Function
        function loadYouTubeVideo(container) {
            const iframe = document.createElement('iframe');
            iframe.setAttribute('src', 'https://www.youtube.com/embed/KN3OYwP8nHE?autoplay=1&rel=0');
            iframe.setAttribute('title', 'YouTube video player');
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
            iframe.setAttribute('allowfullscreen', '');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.borderRadius = '8px';
            iframe.style.display = 'block';
            
            container.innerHTML = '';
            container.appendChild(iframe);
            container.style.cursor = 'default';
            container.removeAttribute('onclick');
        }

        // Modal JS
        const modal = document.getElementById('img-modal');
        const modalImg = document.getElementById('img-modal-img');

        function openModal(src) {
            modalImg.src = src;
            modal.showModal();
        }

        function closeModal() {
            modal.close();
        }d
    </script>
</body>
</html>
