<!-- Main Content Area -->
<main id="main-content" style="flex-grow: 1; padding: 40px 20px; background-color: #0f172a;">
    <div style="max-width: 1100px; margin: 0 auto; font-family: sans-serif;">
        
        <!-- Title Banner -->
        <div style="border-bottom: 1px solid #374151; padding-bottom: 16px; margin-bottom: 32px;">
            <h1 style="color: #22d3ee; font-size: 32px; font-weight: 800; margin: 0;">
                Socials
            </h1>
        </div>

        <!-- Dividing Line -->
        <div style="border-top: 1px solid #374151; margin-bottom: 32px;"></div>

        <!-- Socials Cards Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
            
            <!-- GitHub Card -->
            <a href="https://github.com" target="_blank" style="display: flex; align-items: center; padding: 20px; background-color: #1e293b; border-radius: 8px; text-decoration: none; border: 1px solid #334155; transition: border-color 0.2s;">
                <div style="font-size: 24px; color: #38bdf8; margin-right: 16px;">
                    <i class="fab fa-github"></i>
                </div>
                <div>
                    <h2 style="color: #f8fafc; font-size: 18px; margin: 0 0 4px 0;">GitHub</h2>
                    <p style="color: #94a3b8; font-size: 14px; margin: 0;">Check out my code repositories</p>
                </div>
            </a>

            <!-- LinkedIn Card -->
            <a href="https://linkedin.com" target="_blank" style="display: flex; align-items: center; padding: 20px; background-color: #1e293b; border-radius: 8px; text-decoration: none; border: 1px solid #334155; transition: border-color 0.2s;">
                <div style="font-size: 24px; color: #38bdf8; margin-right: 16px;">
                    <i class="fab fa-linkedin"></i>
                </div>
                <div>
                    <h2 style="color: #f8fafc; font-size: 18px; margin: 0 0 4px 0;">LinkedIn</h2>
                    <p style="color: #94a3b8; font-size: 14px; margin: 0;">Connect with me professionally</p>
                </div>
            </a>

            <!-- Twitter / X Card -->
            <a href="https://twitter.com" target="_blank" style="display: flex; align-items: center; padding: 20px; background-color: #1e293b; border-radius: 8px; text-decoration: none; border: 1px solid #334155; transition: border-color 0.2s;">
                <div style="font-size: 24px; color: #38bdf8; margin-right: 16px;">
                    <i class="fab fa-twitter"></i>
                </div>
                <div>
                    <h2 style="color: #f8fafc; font-size: 18px; margin: 0 0 4px 0;">Twitter</h2>
                    <p style="color: #94a3b8; font-size: 14px; margin: 0;">Follow my thoughts and updates</p>
                </div>
            </a>

            <!-- Discord Card -->
            <a href="https://discord.com" target="_blank" style="display: flex; align-items: center; padding: 20px; background-color: #1e293b; border-radius: 8px; text-decoration: none; border: 1px solid #334155; transition: border-color 0.2s;">
                <div style="font-size: 24px; color: #38bdf8; margin-right: 16px;">
                    <i class="fab fa-discord"></i>
                </div>
                <div>
                    <h2 style="color: #f8fafc; font-size: 18px; margin: 0 0 4px 0;">Discord</h2>
                    <p style="color: #94a3b8; font-size: 14px; margin: 0;">Chat with me directly</p>
                </div>
            </a>

        </div>
    </div>
</main>
