<style>
    /* Match the shared Charity and Work With Me card spacing and typography. */
    .esports-theme .socials-page .social-grid .brand-card { box-sizing:border-box;min-width:0;min-height:96px;padding:16px;gap:16px; }
    .social-grid .brand-card-icon { width:44px;height:44px;font-size:22px; }
    .social-grid .brand-card-body { display:grid;gap:6px;overflow:visible; }
    .esports-theme .socials-page .brand-card-title { margin:0;font-size:16px;line-height:1.3;font-weight:700;white-space:normal;overflow:visible; }

    /* Video Box Styling */
    .video-container {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        border: 3px solid rgb(var(--color-gold) / 0.7);
        box-shadow: 0 0 18px rgb(var(--color-gold) / 0.35);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(31, 41, 55, 0.5);
        box-sizing: border-box;
        aspect-ratio: 16 / 9;
    }

    .video-container iframe {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        display: block;
    }

    .video-container:hover {
        transform: translateY(-3px);
        border-color: rgb(var(--color-gold));
    }

    .video-play-btn {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        background: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .video-container:hover .video-play-btn {
        transform: scale(1.12);
    }

    /* Image Box Interactivity & White Glow Effect */
    .img-container {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        cursor: pointer;
        border: 3px solid rgb(var(--color-gold) / 0.7);
        box-shadow: 0 0 18px rgb(var(--color-gold) / 0.35);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(31, 41, 55, 0.5);
        box-sizing: border-box;
        aspect-ratio: 16 / 9;
    }

    .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        display: block;
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    .img-container:hover {
        transform: translateY(-3px);
        border-color: rgb(var(--color-gold));
    }

    .img-container:hover img {
        transform: scale(1.02);
        filter: brightness(1.1);
    }

    /* "Click to enlarge" hint — fades in on hover, ties the image back
       to the click-to-zoom lightbox it already opens. */
    .img-zoom-hint {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0);
        opacity: 0;
        transition: opacity 0.25s ease, background 0.25s ease;
        pointer-events: none;
    }
    .img-container:hover .img-zoom-hint {
        opacity: 1;
        background: rgba(15, 23, 42, 0.35);
    }
    .img-zoom-hint svg {
        color: #ffffff;
        font-size: 22px;
        width: 48px;
        height: 48px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.75);
        border: 1.5px solid rgb(var(--color-gold) / 0.85);
        transform: scale(0.85);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .img-container:hover .img-zoom-hint svg {
        transform: scale(1);
    }

    /* Responsive Mobile Layout Adjustments */
    @media (max-width: 768px) {
        .main-social-container {
            flex-direction: column !important;
        }
        .social-grid {
            grid-template-columns: 1fr !important;
            max-width: 100% !important;
        }
        .image-col {
            width: 100% !important;
            height: auto !important;
            position: static !important;
        }
    }


    /* Match the five desktop link rows to the full media column height. */
    @media(min-width:1101px) {
        .esports-theme .socials-page .main-social-container { align-items:stretch; }
        .esports-theme .socials-page .main-social-container > .social-grid {
            align-self:stretch;align-content:stretch;grid-template-rows:repeat(5,minmax(72px,1fr));
        }
        .esports-theme .socials-page .social-grid > .brand-card { min-height:72px;padding:12px 16px; }
    }

</style>

<script>
    // YouTube Lazy Loader Function
    function loadYouTubeVideo(container) {
        const iframe = document.createElement('iframe');
        iframe.setAttribute('src', 'https://www.youtube.com/embed/x-nnoa7h-uE?autoplay=1&rel=0');
        iframe.setAttribute('title', 'YouTube video player');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', '');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.borderRadius = '8px';
        iframe.style.display = 'block';

        container.innerHTML = '';
        container.appendChild(iframe);
        container.style.cursor = 'default';
        container.removeAttribute('onclick');
        container.removeAttribute('role');
        container.removeAttribute('tabindex');
        container.removeAttribute('aria-label');
        container.removeAttribute('data-video-preview');
        iframe.focus();
    }
</script>
