<style>
    /* Social links use the shared .brand-card component (see head.html);
       sized up a bit from the shared default so the text reads at the
       same weight as the rest of the site's sub-pages. */
    .social-grid .brand-card-icon {
        width: 46px;
        height: 46px;
        font-size: 20px;
    }
    .social-grid .brand-card-title {
        font-size: 16px;
    }
    .social-grid .brand-card-subtitle {
        font-size: 13px;
    }

    /* Video Box Styling */
    .video-container {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        border: 2px solid rgb(var(--color-gold) / 0.7);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(31, 41, 55, 0.5);
        box-sizing: border-box;
        aspect-ratio: 16 / 9;
    }

    .video-container iframe {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        display: block;
    }

    .video-container:hover {
        transform: translateY(-3px);
        border-color: rgb(var(--color-gold));
    }

    .video-play-btn {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        background: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .video-container:hover .video-play-btn {
        transform: scale(1.12);
    }

    /* Image Box Interactivity & White Glow Effect */
    .img-container {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        cursor: pointer;
        border: 2px solid rgb(var(--color-gold) / 0.7);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(31, 41, 55, 0.5);
        box-sizing: border-box;
        aspect-ratio: 16 / 9;
    }

    .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        display: block;
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    .img-container:hover {
        transform: translateY(-3px);
        border-color: rgb(var(--color-gold));
    }

    .img-container:hover img {
        transform: scale(1.02);
        filter: brightness(1.1);
    }

    /* "Click to enlarge" hint — fades in on hover, ties the image back
       to the click-to-zoom lightbox it already opens. */
    .img-zoom-hint {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0);
        opacity: 0;
        transition: opacity 0.25s ease, background 0.25s ease;
        pointer-events: none;
    }
    .img-container:hover .img-zoom-hint {
        opacity: 1;
        background: rgba(15, 23, 42, 0.35);
    }
    .img-zoom-hint i {
        color: #ffffff;
        font-size: 22px;
        width: 48px;
        height: 48px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.75);
        border: 1.5px solid rgb(var(--color-gold) / 0.85);
        transform: scale(0.85);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .img-container:hover .img-zoom-hint i {
        transform: scale(1);
    }

    /* Responsive Mobile Layout Adjustments */
    @media (max-width: 768px) {
        .main-social-container {
            flex-direction: column !important;
        }
        .social-grid {
            grid-template-columns: 1fr !important;
            max-width: 100% !important;
        }
        .image-col {
            width: 100% !important;
            height: auto !important;
            position: static !important;
        }
    }

</style>

<script>
    // YouTube Lazy Loader Function
    function loadYouTubeVideo(container) {
        const iframe = document.createElement('iframe');
        iframe.setAttribute('src', 'https://www.youtube.com/embed/x-nnoa7h-uE?autoplay=1&rel=0');
        iframe.setAttribute('title', 'YouTube video player');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', '');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.borderRadius = '8px';
        iframe.style.display = 'block';

        container.innerHTML = '';
        container.appendChild(iframe);
        container.style.cursor = 'default';
        container.removeAttribute('onclick');
    }
</script>
