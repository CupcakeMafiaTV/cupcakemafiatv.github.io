<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 450px;
            background-color: #000;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge {
            display: none;
            background-color: #ff0000;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        dialog {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Stream <span id="twitch-live-badge" class="badge">LIVE</span></h1>
        
        <!-- YouTube Lazy Load Container -->
        <div class="video-container" id="video-box" onclick="loadYouTubeVideo(this)">
            <!-- Thumbnail preview image matching the Jinx video -->
            <img src="https://img.youtube.com/vi/KN3OYwP8nHE/hqdefault.jpg" alt="Jinx Video Thumbnail">
        </div>
    </div>

    <!-- Modal for images -->
    <dialog id="img-modal">
        <form method="dialog">
            <button onclick="closeModal()" style="float: right;">Close</button>
        </form>
        <img id="img-modal-img" src="" alt="Modal Image" style="max-width: 100%; margin-top: 10px;">
    </dialog>

    <script>
        // YouTube Lazy Loader Function
        function loadYouTubeVideo(container) {
            const iframe = document.createElement('iframe');
            // Updated with Jinx: Champion Spotlight video ID: KN3OYwP8nHE
            iframe.setAttribute('src', 'https://www.youtube.com/embed/KN3OYwP8nHE?autoplay=1&rel=0');
            iframe.setAttribute('title', 'YouTube video player');
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
            iframe.setAttribute('allowfullscreen', '');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.borderRadius = '8px';
            iframe.style.display = 'block';
            
            container.innerHTML = '';
            container.appendChild(iframe);
            container.style.cursor = 'default';
            container.removeAttribute('onclick');
        }

        // Modal JS
        const modal = document.getElementById('img-modal');
        const modalImg = document.getElementById('img-modal-img');

        function openModal(src) {
            modalImg.src = src;
            modal.showModal();
        }

        function closeModal() {
            modal.close();
        }

        // Dynamic Twitch Live Check
        async function checkTwitchLiveStatus(channelName) {
            try {
                const response = await fetch('https://gql.twitch.tv/gql', {
                    method: 'POST',
                    headers: {
                        'Client-ID': 'kimne78kx3ncx6brogo4mv6wki5h11'
                    },
                    body: JSON.stringify({
                        query: `query { user(login: "${channelName}") { stream { type } } }`
                    })
                });
                const data = await response.json();
                if (data?.data?.user?.stream?.type === 'live') {
                    document.getElementById('twitch-live-badge').style.display = 'inline-block';
                }
            } catch (e) {
                console.log('Unable to check Twitch live status', e);
            }
        }

        checkTwitchLiveStatus('cupcakemafiatv');
    </script>
</body>
</html>
